version: 2
models:
  - name: stg_notes
    description: Clinical notes, one row per note.
    columns:
      - name: note_id
        meta: { data_class: none }
        data_tests: [unique, not_null]
      - name: kind
        meta: { data_class: none }
        data_tests:
          - accepted_values: { arguments: { values: [progress, discharge] } }
      - { name: clinic_id, meta: { data_class: none }, data_tests: [not_null] }
      - { name: patient_id, meta: { data_class: phi } }
      - { name: signed_at, meta: { data_class: phi } }
      - { name: _updated_at, meta: { data_class: none } }
